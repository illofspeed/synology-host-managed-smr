# LUKS opens ONLY on the cache device. Opening it on the raw md127 would bypass dirty
# (not yet written back) blocks in the writeback cache and corrupt the filesystem.
[Unit]
Requires=zonedpool-volcache.service
After=zonedpool-volcache.service

[Service]
ExecStart=
ExecStart=/bin/sh -c "for t in $(seq 1 60); do [ -b /dev/mapper/hc680cache ] && break; sleep 5; done; [ -b /dev/mapper/hc680cache ] || { echo 'hc680cache missing - refusing to open LUKS on the raw array'; exit 1; }; /sbin/cryptsetup status hc680crypt >/dev/null 2>&1 || /sbin/cryptsetup open --key-file /etc/zonedpool/hc680.key /dev/mapper/hc680cache hc680crypt"
